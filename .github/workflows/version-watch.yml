# Version watch: every Monday, and on demand, compares the RustDesk and Tailscale versions the install scripts pin
# with their releases on GitHub, using tools/check-versions.sh (its header says when a bump is due). A due bump fails
# the run, with the report in the run's summary: GitHub emails a failed scheduled run to whoever last changed this
# schedule. It has read-only permissions and never changes code: a bump needs new SHA-256 values and a re-test, which
# stay by hand. Kept apart from CI, whose results never depend on the network. GitHub pauses schedules in a public
# repo after 60 days without activity; run it by hand to check.
name: Version watch

on:
  schedule:
    - cron: "41 7 * * 1" # Mondays, after CI's weekly run
  workflow_dispatch:

permissions: {}

# One run at a time; a second waits instead of cancelling the first.
concurrency:
  group: version-watch
  cancel-in-progress: false

jobs:
  watch:
    name: Compare pinned versions with the releases
    runs-on: ubuntu-latest # gh comes with the runner; nothing is downloaded
    timeout-minutes: 5
    permissions:
      contents: read # check out the scripts whose pins are read; the release lookups need nothing more
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the comparison on known releases first
        run: |
          # A made-up release far newer and older than two weeks must make a bump due (exit 1), and releases older
          # than the pins must not (exit 0), so a run that reports nothing really did compare.
          printf '99.0.0 2000-01-01T00:00:00Z\n' > "$RUNNER_TEMP/due.txt"
          printf '0.0.1 2000-01-01T00:00:00Z\n' > "$RUNNER_TEMP/old.txt"
          code=0; tools/check-versions.sh "$RUNNER_TEMP/due.txt" "$RUNNER_TEMP/old.txt" > /dev/null || code=$?
          [ "$code" -eq 1 ] || { echo "Expected a bump due (exit 1), got exit $code" >&2; exit 1; }
          tools/check-versions.sh "$RUNNER_TEMP/old.txt" "$RUNNER_TEMP/old.txt" > /dev/null
      - name: Look up the releases and compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The newest 100 published releases, drafts and pre-releases left out, as "tag time" lines. A failed lookup
          # stops the step here. tools/check-versions.sh refuses any line not shaped like a version and a time.
          releases() {
            gh api "repos/$1/releases?per_page=100" \
              --jq '.[] | select((.draft or .prerelease) | not) | .tag_name + " " + .published_at' > "$2"
          }
          releases rustdesk/rustdesk "$RUNNER_TEMP/rustdesk.txt"
          releases tailscale/tailscale "$RUNNER_TEMP/tailscale.txt"
          code=0
          tools/check-versions.sh "$RUNNER_TEMP/rustdesk.txt" "$RUNNER_TEMP/tailscale.txt" > "$RUNNER_TEMP/report.md" ||
            code=$?
          tee -a "$GITHUB_STEP_SUMMARY" < "$RUNNER_TEMP/report.md"
          if [ "$code" -eq 1 ]; then echo '::error::A pinned version is due a bump: see the report in the summary.'; fi
          exit "$code"
