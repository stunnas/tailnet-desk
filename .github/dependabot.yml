# Keeps the pinned GitHub Actions current. Version updates wait 14 days after a release; security updates don't.
# Dependabot can't see the other pins. These are bumped by hand: ShellCheck, bats, actionlint, zizmor and gitleaks in
# ci.yml, and Pester and PSScriptAnalyzer in tools/install-ps-modules.ps1. RustDesk and Tailscale, pinned in
# scripts/windows/tailnet-desk.psm1 and scripts/mac/tailnet-desk.sh, get a bump PR from the version watch
# (workflows/version-watch.yml); their Apple signing teams in the Mac script stay by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
