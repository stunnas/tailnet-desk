# Keeps the pinned GitHub Actions current. Version updates wait 14 days after a release; security updates don't.
# Tools downloaded by version in ci.yml (ShellCheck, bats, actionlint, zizmor, Pester, PSScriptAnalyzer) are bumped
# by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
